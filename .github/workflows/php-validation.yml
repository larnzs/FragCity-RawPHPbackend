name: PHP validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_mysql, mbstring
          coverage: none

      - name: Lint every PHP source file
        run: |
          set -eu
          find . \
            -type d \( -name .git -o -name vendor -o -name node_modules \) -prune -o \
            -type f -name '*.php' -print0 \
            | xargs -0 -r -n1 php -l

      - name: Check current database/API architecture
        run: php linuxapi/tools/architecture-check.php

      - name: Validate settings JSON
        run: php -r "json_decode(file_get_contents('settings/settings.example.json'), true, 512, JSON_THROW_ON_ERROR); echo 'settings JSON OK', PHP_EOL;"
