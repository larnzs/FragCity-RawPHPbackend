name: Import official Flute release package

on:
  push:
    branches:
      - flute-base
    paths:
      - ".github/workflows/import-flute-release.yml"

permissions:
  contents: write

jobs:
  import-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out FragCity branch
        uses: actions/checkout@v4
        with:
          ref: flute-base
          fetch-depth: 1

      - name: Download the official Flute release that includes vendor
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v1.0.7"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          curl --fail --silent --show-error --location --retry 3 \
            "https://api.github.com/repos/Flute-CMS/cms/releases/tags/${VERSION}" \
            --output "$WORK/release.json"

          mapfile -t ASSETS < <(
            jq -r '[.assets[] | select(.name | ascii_downcase | endswith(".zip"))]
              | sort_by(if (.name | ascii_downcase | contains("vendor")) then 0 else 1 end)
              | .[].name' "$WORK/release.json"
          )

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::No ZIP release asset was found for ${VERSION}."
            jq -r '.assets[].name' "$WORK/release.json"
            exit 1
          fi

          SOURCE_ROOT=""
          INDEX=0
          for ASSET in "${ASSETS[@]}"; do
            INDEX=$((INDEX + 1))
            URL="$(jq -r --arg name "$ASSET" '.assets[] | select(.name == $name) | .browser_download_url' "$WORK/release.json")"
            ZIP="$WORK/package-${INDEX}.zip"
            EXTRACT="$WORK/extract-${INDEX}"
            mkdir -p "$EXTRACT"
            echo "Checking release asset: $ASSET"
            curl --fail --silent --show-error --location --retry 3 "$URL" --output "$ZIP"
            unzip -q "$ZIP" -d "$EXTRACT"

            AUTOLOAD="$(find "$EXTRACT" -type f -path '*/vendor/autoload.php' -print -quit)"
            if [ -n "$AUTOLOAD" ]; then
              SOURCE_ROOT="${AUTOLOAD%/vendor/autoload.php}"
              echo "Found a complete release package with vendor in: $ASSET"
              break
            fi
          done

          if [ -z "$SOURCE_ROOT" ]; then
            echo "::error::No official ZIP asset for ${VERSION} contained vendor/autoload.php. Repository was not replaced."
            exit 1
          fi

          test -f "$SOURCE_ROOT/vendor/autoload.php"
          if find "$SOURCE_ROOT" -type f -size +95M -print -quit | grep -q .; then
            echo "::error::A release file exceeds 95 MiB; refusing to commit a file that may violate GitHub's file-size limit."
            find "$SOURCE_ROOT" -type f -size +95M -print
            exit 1
          fi

          echo "Release root: $SOURCE_ROOT"
          echo "Vendor file count: $(find "$SOURCE_ROOT/vendor" -type f | wc -l)"
          du -sh "$SOURCE_ROOT/vendor"

          # Replace the source-only Flute tree with the official release package.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$SOURCE_ROOT"/. .
          rm -f .github/workflows/import-flute-release.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          test -f vendor/autoload.php
          git add -f -A
          if git diff --cached --quiet; then
            echo "The branch already matches the release package."
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "build(flute): import official v1.0.7 release with vendor"
          git push origin HEAD:flute-base
