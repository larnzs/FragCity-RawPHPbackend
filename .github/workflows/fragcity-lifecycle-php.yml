name: FragCity Lifecycle Website Checks

on:
  push:
    branches: [main]
    paths:
      - "api/admin-lifecycle.php"
      - "class/PaymenterApiClient.php"
      - "pages/lifecycle.php"
      - "js/lifecycle.js"
      - "tools/lifecycle-preflight.php"
      - ".github/workflows/fragcity-lifecycle-php.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/admin-lifecycle.php"
      - "class/PaymenterApiClient.php"
      - "pages/lifecycle.php"
      - "js/lifecycle.js"
      - "tools/lifecycle-preflight.php"
      - ".github/workflows/fragcity-lifecycle-php.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-syntax:
    name: PHP 8.3 and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Lint lifecycle PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "api/admin-lifecycle.php"
            "class/PaymenterApiClient.php"
            "pages/lifecycle.php"
            "index.php"
            "tools/lifecycle-preflight.php"
          )
          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Run website lifecycle static preflight
        run: php tools/lifecycle-preflight.php

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check lifecycle JavaScript syntax
        run: node --check js/lifecycle.js
