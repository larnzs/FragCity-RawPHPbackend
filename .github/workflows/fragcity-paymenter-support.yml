name: FragCity Paymenter Support Integration

on:
  push:
    branches: [main]
    paths:
      - "api/support.php"
      - "class/PaymenterSupportApiClient.php"
      - "pages/support.php"
      - "includes/header.php"
      - "includes/footer.php"
      - "css/header.css"
      - "css/footer.css"
      - "js/support.js"
      - "css/support.css"
      - "settings/settings.example.json"
      - "tools/paymenter-support-preflight.php"
      - "docs/FRAGCITY-PAYMENTER-SUPPORT.md"
      - ".github/workflows/fragcity-paymenter-support.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/support.php"
      - "class/PaymenterSupportApiClient.php"
      - "pages/support.php"
      - "includes/header.php"
      - "includes/footer.php"
      - "css/header.css"
      - "css/footer.css"
      - "js/support.js"
      - "css/support.css"
      - "settings/settings.example.json"
      - "tools/paymenter-support-preflight.php"
      - "docs/FRAGCITY-PAYMENTER-SUPPORT.md"
      - ".github/workflows/fragcity-paymenter-support.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-and-frontend-checks:
    name: PHP 8.3, JavaScript and support contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Lint support PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "api/support.php"
            "class/PaymenterSupportApiClient.php"
            "pages/support.php"
            "includes/header.php"
            "includes/footer.php"
            "tools/paymenter-support-preflight.php"
          )
          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Validate settings example JSON
        run: php -r '$v=json_decode(file_get_contents("settings/settings.example.json"), true, 512, JSON_THROW_ON_ERROR); $s=$v["integrations"]["paymenter_support"]??[]; if (!isset($s["base_url"], $s["admin_api_key"], $s["shared_secret"]) || !is_array($s["departments"]??null)) { exit(1); }'

      - name: Ensure the support page does not write local ticket records
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq "INSERT[[:space:]]+INTO[[:space:]]+(tickets|ticket_replies)" pages/support.php; then
            echo "Legacy local ticket writes detected in pages/support.php"
            exit 1
          fi

      - name: Verify headset support shortcut in the header
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="fc-support-toggle' includes/header.php
          grep -q 'fa-solid fa-headset' includes/header.php
          grep -q 'data-ajax-nav' includes/header.php
          grep -q 'data-slug="support"' includes/header.php
          grep -q 'fc-support-toggle:hover' css/header.css
          grep -q 'fc-support-toggle__label' css/header.css

      - name: Verify Telegram channel links and left header support shortcut
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'class="fc-support-toggle' includes/header.php
          grep -Fq 'class="shock-brand"' includes/header.php
          grep -Fq 'shock-brand > .fc-support-toggle' css/header.css
          if grep -Fq 'shock-user-area-wrapper > .fc-support-toggle' css/header.css; then
            echo "Support shortcut must no longer be positioned in right-side user actions"
            exit 1
          fi
          grep -Fq 'https://t.me/fragcitychannel' includes/footer.php
          grep -Fq '@fragcitychannel' includes/footer.php
          grep -Fq 'https://t.me/fragcitychannel' pages/support.php
          grep -Fq '@fragcitychannel' pages/support.php
          grep -Fq 'https://steamcommunity.com/id/larnz/' includes/footer.php
          grep -Fq 'https://steamcommunity.com/id/larnz/' pages/support.php
          grep -Fq 'social-item--steam' pages/support.php
          grep -Fq 'footer-steam-button' css/footer.css
          grep -Fq 'social-icon--steam' css/support.css
          grep -Fq 'https://discord.gg/s6rFThCDdY' includes/footer.php
          grep -Fq 'https://discord.gg/s6rFThCDdY' pages/support.php
          grep -Fq 'social-item--discord' pages/support.php
          grep -Fq 'footer-discord-button' css/footer.css
          grep -Fq 'social-icon--discord' css/support.css
          grep -Fq 'fa-brands fa-discord' pages/support.php
          grep -Fq '217.18.90.7:2014' pages/support.php
          grep -Fq 'ts3server://217.18.90.7?port=2014' pages/support.php
          grep -Fq "const tsAddress = '217.18.90.7:2014';" js/support.js
          grep -Fq '/assets/images/logo/telegram.png' pages/support.php
          grep -Fq '/assets/images/logo/teamspeak.png' pages/support.php
          grep -Fq 'https://t.me/fragcitysup' pages/support.php
          grep -Fq '@fragcitysup' pages/support.php
          grep -Fq 'footer-contact-buttons' includes/footer.php
          grep -Fq 'footer-contact-buttons' css/footer.css
          grep -Fq 'footer-contact-button--primary' includes/footer.php
          grep -Fq 'href="/support/?tab=tickets"' includes/footer.php
          grep -Fq 'https://t.me/fragcitysup' includes/footer.php
          grep -Fq '@fragcitysup' includes/footer.php
          grep -Fq 'https://t.me/fragcitychannel' includes/footer.php
          grep -Fq '@fragcitychannel' includes/footer.php
          grep -Fq 'https://discord.gg/s6rFThCDdY' includes/footer.php
          grep -Fq 'https://steamcommunity.com/id/larnz/' includes/footer.php
          grep -Fq 'ts3server://217.18.90.7?port=2014' includes/footer.php
          grep -Fq '217.18.90.7:2014' includes/footer.php
          grep -Fq 'mailto:support@fragcity.ir' includes/footer.php
          grep -Fq '.footer-contact-button--teamspeak' css/footer.css
          grep -Fq 'display: grid;' css/footer.css
          if grep -Eiq 'rubika|روبیکا' pages/support.php includes/footer.php css/footer.css; then
            echo "Rubika is not an available FragCity contact channel."
            exit 1
          fi
          grep -Fq 'support-contact-actions' pages/support.php
          grep -Fq 'support-action-btn--primary' pages/support.php
      - name: Verify fail-closed ticket ownership
        shell: bash
        run: |
          set -euo pipefail
          client="class/PaymenterSupportApiClient.php"
          if grep -Fq "'include' => 'user'" "$client" || grep -Fq "'include' => 'messages,user'" "$client"; then
            echo "Ticket reads must not require the unrelated View Users permission"
            exit 1
          fi
          grep -Fq "'include' => 'messages'" "$client"
          grep -Fq "\$attributes['user_id']" "$client"
          grep -Fq "'ticket_message_includes' => true" "$client"
          test "$(grep -Fc 'resourceOwnerUserId($resource) !== $userId' "$client")" -ge 3
          grep -Fq '? $matchedUserId !== $userId' "$client"
          grep -Fq 'private function resourceOwnerUserId' "$client"
      - name: Verify initial ticket creation does not depend on a second detail read
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'public function replyToNewTicket' class/PaymenterSupportApiClient.php
          grep -Fq '$client->replyToNewTicket(' api/support.php
          if grep -Fq "'owner_user_id' =>" api/support.php; then
            echo "Internal Paymenter owner ID must never be returned by the website API"
            exit 1
          fi
      - name: Verify support identity matches local email, phone and Paymenter ID
        shell: bash
        run: |
          set -euo pipefail
          client="class/PaymenterSupportApiClient.php"
          endpoint="api/support.php"
          grep -Fq 'public function verifyCustomerIdentity' "$client"
          grep -Fq 'hash_equals($websiteEmail, $paymenterEmail)' "$client"
          grep -Fq 'hash_equals($websitePhone, $paymenterPhone)' "$client"
          grep -Fq '(int) $paymenterUserId !== $websitePaymenterUserId' "$client"
          grep -Fq 'SELECT username, email, phone, paymenter_user_id' "$endpoint"
          grep -Fq '$client->verifyCustomerIdentity(' "$endpoint"
          grep -Fq 'paymenter_support_identity_mismatch' "$endpoint"
      - name: Verify ticket form contract and CAPTCHA protections
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'support-ticket-form' pages/support.php
          grep -Fq 'name="customer_name"' pages/support.php
          grep -Fq 'name="department"' pages/support.php
          grep -Fq 'name="priority"' pages/support.php
          grep -Fq 'name="service"' pages/support.php
          grep -Fq 'name="domain"' pages/support.php
          grep -Fq 'supportCaptchaQuestion' pages/support.php
          grep -Fq "if (\$action === 'captcha_challenge')" api/support.php
          grep -Fq "if (\$action === 'create_ticket')" api/support.php
          grep -Fq "'answer_hash' => hash('sha256'" api/support.php
          grep -Fq 'captcha_invalid' api/support.php
          grep -Fq 'setPanelVisibility' js/support.js
          grep -Fq 'is-closing' js/support.js
          grep -Fq '.is-exiting' css/support.css
      - name: Verify two-column support dashboard layout
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'support-dashboard-layout' pages/support.php
          grep -Fq 'grid-template-columns: minmax(0, 7fr) minmax(0, 3fr)' css/support.css
          grep -Fq '.support-dashboard-layout .support-create-card' css/support.css
          grep -Fq '.support-dashboard-layout #supportListCard' css/support.css
          grep -Fq '.support-dashboard-layout > .support-faq' css/support.css
          grep -Fq 'display: contents' css/support.css
          grep -Fq 'setPanelVisibility(listCard, true)' js/support.js
      - name: Verify support page frame matches VIP page
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'padding-left: clamp(18px, 4vw, 64px);' css/support.css
          grep -Fq 'padding-right: clamp(18px, 4vw, 64px);' css/support.css
          grep -Fq '.support-page > .support-dashboard-layout' css/support.css
          grep -Fq 'width: 100%;' css/support.css
          grep -Fq 'max-width: none;' css/support.css
          grep -Fq 'grid-template-columns: minmax(0, 7fr) minmax(0, 3fr)' css/support.css
          grep -Fq 'grid-template-columns: minmax(0, 1fr);' css/support.css
          if sed -n '/Support dashboard: match VIP page frame exactly/,$p' css/support.css | grep -Fq 'max-width: 1440px;'; then
            echo "Support page must not impose a narrower 1440px cap than VIP."
            exit 1
          fi
      - name: Check support JavaScript
        run: node --check js/support.js
