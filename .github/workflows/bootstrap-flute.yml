name: Bootstrap Flute CMS base

on:
  push:
    branches:
      - flute-base

permissions:
  contents: write

concurrency:
  group: bootstrap-flute-base
  cancel-in-progress: false

jobs:
  import-flute:
    if: github.ref == 'refs/heads/flute-base'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FragCity branch
        uses: actions/checkout@v4
        with:
          ref: flute-base
          fetch-depth: 0

      - name: Fetch the latest stable Flute release
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/bootstrap-flute.yml /tmp/bootstrap-flute.yml
          git clone --depth 1 --branch v1.0.7 --single-branch https://github.com/Flute-CMS/cms.git /tmp/flute-upstream
          actual="$(git -C /tmp/flute-upstream rev-parse HEAD)"
          expected="4d62a49e90bd812df4a885aa1a4f6bc5a6f50f99"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Flute tag v1.0.7 does not match the expected published commit."
            exit 1
          fi
          for required in README.md LICENSE composer.json bootstrap/app.php index.php; do
            test -f "/tmp/flute-upstream/$required" || {
              echo "::error::Expected Flute file missing: $required"
              exit 1
            }
          done
          # Avoid importing upstream Actions workflows; the connected GitHub App
          # is intentionally not granted permission to create or update workflows.
          rm -rf /tmp/flute-upstream/.github/workflows

      - name: Replace branch working tree with Flute source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          find /tmp/flute-upstream -mindepth 1 -maxdepth 1 ! -name .git -exec cp -a --target-directory=. -- {} +
          mkdir -p .github/workflows
          cp /tmp/bootstrap-flute.yml .github/workflows/bootstrap-flute.yml
          test -f README.md
          test -f composer.json
          test -f LICENSE
          test -f bootstrap/app.php
          test -f index.php
          if [[ -e settings/settings.json ]]; then
            echo "::error::Unexpected runtime settings file found in imported source."
            exit 1
          fi

      - name: Commit Flute base on flute-base only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bootstrap Flute CMS v1.0.7 base"
          git push origin HEAD:flute-base

      - name: Attempt to set the new default branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(curl -sS -o /tmp/default-branch-response.json -w "%{http_code}" \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/larnzs/FragCity-RawPHPbackend \
            -d '{"default_branch":"flute-base"}')"
          if [[ "$response" == "200" ]]; then
            echo "Default branch changed to flute-base."
          else
            echo "::warning::Flute source was imported, but GITHUB_TOKEN could not change repository default branch (HTTP $response). An owner/admin may need to set it in repository Settings > General > Default branch."
            cat /tmp/default-branch-response.json
          fi
